name: Web BFF CI

on:
  push:
    paths:
      - "web-bff/**"
      - ".github/workflows/web-bff.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-bff

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: Run tests
        run: bun test
        env:
          JWT_SECRET: test-secret
